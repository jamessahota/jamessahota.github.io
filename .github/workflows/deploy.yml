# Builds the site, runs the checks and publishes it to GitHub Pages
# every time a change reaches the main branch.
#
# Before the first push, on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until that is set, GitHub publishes the repository's files directly and this workflow cannot deploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer run waits for the one in progress to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, check, build and upload the site
        uses: withastro/action@v6
        with:
          # Type check, build, then run the smoke tests. A failure stops the deployment.
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
