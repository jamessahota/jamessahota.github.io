# Builds the site, runs the checks and publishes it to GitHub Pages
# every time a change reaches the main branch, and each weekday evening so that
# the latest prices beside open views on the research page stay current.
#
# On GitHub, Settings → Pages has Source set to "GitHub Actions" and the custom domain jsahota.com.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:
  # 22:30 UTC, Monday to Friday: after US markets close. Nothing is committed;
  # the refreshed prices go only into the published site.
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer run waits for the one in progress to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Refresh the latest prices shown beside open views
        # A source that cannot be reached keeps the last committed price, so the site still deploys.
        run: node scripts/update-prices.mjs
        continue-on-error: true
      - name: Install, check, build and upload the site
        uses: withastro/action@v6
        with:
          # Type check, build, then run the smoke tests. A failure stops the deployment.
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
