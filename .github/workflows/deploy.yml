# Builds the site, runs the checks and publishes it to GitHub Pages
# every time a change reaches the main branch, and each weekday evening so that
# the latest prices beside open views on the research page stay current.
#
# On GitHub, Settings → Pages has Source set to "GitHub Actions" and the custom domain jsahota.com.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:
  # 17:30 New York, Monday to Friday: after the close and before futures reopen.
  # The timezone keeps this window correct through daylight-saving changes. Nothing is committed;
  # the refreshed prices go only into the published site.
  schedule:
    - cron: '30 17 * * 1-5'
      timezone: America/New_York

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer run waits for the one in progress to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Restore last verified market observations
        uses: actions/cache/restore@v5
        with:
          path: .cache/market-prices.json
          key: market-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-prices-v1-
      - name: Refresh the latest prices shown beside open views
        # Partial failures retain verified observations, including those from prior runs.
        run: node scripts/update-prices.mjs
        continue-on-error: true
      - name: Save verified market observations for the next refresh
        if: ${{ !cancelled() && hashFiles('.cache/market-prices.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/market-prices.json
          key: market-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install, check, build and upload the site
        uses: withastro/action@v6
        with:
          # Type check, build, then run the smoke tests. A failure stops the deployment.
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
