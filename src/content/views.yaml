# Views and outcomes: dated, numeric views from the reports, and what the market did.
#
# Rules
# - Listed: every base-case view in a report that puts a named benchmark in a price range at a
#   set date or as an average over a set period, and every call card on the report's 6:05 Markets
#   page. Keep every one, including those that miss. Conditional scenarios are not listed, nor
#   views with no named benchmark or no set date. Where a report's base case was also published
#   as a call for the same range and period, it is listed once, as the call.
# - A report view that names only "Brent" is judged on front-month Brent futures, the Brent
#   price the reports quote. A call is judged on the series it says it resolves against.
# - `view` follows the published wording. Add nothing the report or call did not say.
# - `instrument` is what the view priced. Judge it against that instrument only.
# - Add `outcome` only once `due` has passed, from a named source, with the date of the price.
# - Whether the outcome is inside the range is worked out by the page. Never type a verdict.
# - `track` names an entry in src/data/latest-prices.json. While the view is open, the page shows
#   that price as the latest. Refresh the prices with `npm run prices`.

